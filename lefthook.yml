pre-commit:
  parallel: true
  commands:
    ktlint:
      glob: "*.{kt,kts}"
      run: ./gradlew ktlintCheck --daemon
    spotless:
      glob: "*.{kt,kts,md,yml,xml,toml}"
      run: ./gradlew spotlessCheck --daemon

commit-msg:
  commands:
    conventional:
      run: npx --no-install commitlint --edit {1}
